name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repo-check:
    name: 仓库健康检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行仓库健康检查
        run: bash scripts/check_repo.sh
        continue-on-error: false

      - name: Markdown 相对链接检查
        run: python3 scripts/check_docs.py
        continue-on-error: false

      - name: 内核头文件/实现符号一致性检查
        run: bash scripts/check_symbols.sh
        continue-on-error: false

      - name: 项目名拼写一致性检查
        run: python3 scripts/check_names.py
        continue-on-error: false

      # 内核整树不入库，靠 patches/ 复原；补丁与被管理的源码一旦分叉，
      # 别人 clone 下来就无法重建同一份内核。这里做 SHA256 + hunk 数校验。
      - name: 内核补丁包完整性校验
        run: bash scripts/kernel-patch.sh --check
        continue-on-error: false

      - name: 冲突标记守卫（独立复核）
        run: |
          echo "扫描合并冲突标记（排除完整内核树内的工具目录）..."
          # 冲突已全部解决（路线 A），不再保留任何白名单：任何冲突标记一律阻断。
          HITS=$(grep -rInE '^(<<<<<<< |>>>>>>> )' \
              --include='*.c' --include='*.h' --include='*.java' \
              --include='*.md' --include='*.sh' --include='*.tex' --include='*.py' . \
              | grep -v '/linux-6.8-main/tools/' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::发现未解决的合并冲突标记，请先解决后再合并。"
            exit 1
          fi
          echo "✅ 未发现任何冲突标记"

  simulator-build:
    name: 模拟器编译校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译 Java 模拟器（可移植 Makefile）
        run: make -C simulator compile

      - name: 依赖库自检（Apache Commons Math 等）
        run: make -C simulator lib-test

      - name: 单元测试（确定性核心逻辑）
        run: make -C simulator test

      - name: 轻量回放校验（可复现实验）
        run: make -C simulator run-quick
